spring:
  application:
    name: pathfinder-ai

  datasource:
    url: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
    # Substitua abaixo pelo seu RM/Usuário Oracle
    username: ${ORACLE_USERNAME:seu_usuario_oracle}
    # Substitua abaixo pela sua senha Oracle
    password: ${ORACLE_PASSWORD:sua_senha_oracle}
    driver-class-name: oracle.jdbc.driver.OracleDriver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        # Geralmente é o mesmo que o username
        default_schema: ${ORACLE_USERNAME:seu_usuario_oracle}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  cache:
    type: caffeine
    cache-names:
      - learning-paths
    caffeine:
      spec: expireAfterWrite=10m,maximumSize=500

  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      # Coloque aqui sua chave da API do Google Gemini
      api-key: ${GEMINI_API_KEY:sua_api_key_do_google_aqui}
      chat:
        options:
          model: gemini-2.0-flash
          temperature: 0.7

  # Correção aplicada: messages deve ficar dentro de spring
  messages:
    basename: i18n/messages
    encoding: UTF-8

api:
  security:
    token:
      # Gere um GUID ou use uma senha forte para assinar os tokens
      secret: ${JWT_SECRET:coloque_um_segredo_jwt_muito_forte_aqui}
